# CADI Lab Education

courses:
  - id: eci
    title: "Experiments and Causal Inference"
    code: "ISS5096"
    level: "Graduate"
    series: "Methods"
    semester: "Spring"
    time: "Thursday, 14:20–17:20"
    location: "TSMC Building, Room R406"
    description: >
      A graduate seminar on experimental and quasi-experimental designs for causal inference.
      This course introduces methods widely used in domains such as marketing, information systems,
      and the social sciences for establishing cause-and-effect relationships from data.
    topics:
      - "Randomized Controlled Trials (RCT)"
      - "Difference-in-Differences (DiD)"
      - "Matching Methods (PSM, CEM)"
      - "Regression Discontinuity Design (RDD)"
      - "Instrumental Variables (IV)"
      - "Causal Machine Learning"
      - "DAGs & Causal Mechanisms"
      - "Panel Data & Fixed Effects"
    syllabus_url: "/assets/courses/eci/ECI_Syllabus.pdf"
    homepage_url: "/teaching/eci/"
    icon: "fa-solid fa-flask"

  - id: pba
    title: "Programming for Business Analytics (Undergraduate)"
    code: "ISS4066"
    level: "Undergraduate"
    series: "Skills"
    semester: "Fall 2026"
    time: "Monday, 14:20–17:20"
    location: "TSMC Building, Room R421"
    description: >
      An undergraduate introduction to data analysis with R for business: wrangling and
      visualizing data, evaluating causal claims, linear regression, and quantifying uncertainty.
    topics:
      - "R Programming Fundamentals"
      - "Data Wrangling & Visualization"
      - "Causality & Regression"
      - "Statistical Uncertainty"
      - "Bootstrapping vs. CLT"
      - "Professional Workflow (R, RStudio, Git, GitHub)"
    syllabus_url: "/assets/courses/pba/ISS4066_PBA_Undergrad_Syllabus_Fall_26.pdf"
    homepage_url: "/teaching/pba/"
    icon: "fa-solid fa-code"

  - id: pba-grad
    title: "Programming for Business Analytics (Graduate)"
    code: "ISS5066"
    level: "Graduate"
    series: "Skills"
    semester: "Fall 2026"
    time: "Thursday, 14:20–17:20"
    location: "TSMC Building, Room R421"
    description: >
      A graduate course on empirical analysis with R: from data wrangling and visualization
      to causal reasoning, regression, and uncertainty quantification, culminating in a
      research-grade project that prepares students for Experiments and Causal Inference.
    topics:
      - "R Programming Fundamentals"
      - "Data Wrangling & Visualization"
      - "Causality, DAGs & Covariate Selection"
      - "Regression & Prediction"
      - "Statistical Uncertainty"
      - "Professional Workflow (R, RStudio, Git, GitHub)"
    syllabus_url: "/assets/courses/pba/ISS5066_PBA_Graduate_Syllabus_Fall_26.pdf"
    homepage_url: "/teaching/pba-grad/"
    icon: "fa-solid fa-code"
